services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rakshak-route-backend:latest
    environment:
      RAKSHAK_DATA_DIR: /app/data
    volumes:
      - offline_queue_data:/app/data
    expose:
      - "8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: rakshak-route-frontend:latest
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  offline_queue_data:
