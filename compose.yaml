services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: rakshak-route-backend:local
    container_name: rakshak-backend
    ports:
      - "8000:8000"
    environment:
      RAKSHAK_DATA_DIR: /app/data
    volumes:
      - offline_queue_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: rakshak-route-frontend:local
    container_name: rakshak-frontend
    ports:
      - "5500:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  offline_queue_data:
    external: true
    name: rakshak-route_offline_queue_data
